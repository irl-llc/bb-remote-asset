syntax = "proto3";

package buildbarn.configuration.bb_remote_asset.fetch;

import "google/protobuf/duration.proto";
import "google/rpc/status.proto";
import "github.com/buildbarn/bb-storage/pkg/proto/configuration/grpc/grpc.proto";
import "github.com/buildbarn/bb-storage/pkg/proto/configuration/http/client/client.proto";

option go_package = "github.com/buildbarn/bb-remote-asset/pkg/proto/configuration/bb_remote_asset/fetch";

message FetcherConfiguration {
  // Formerly used to specify caching fetcher, this is now implied by
  // presence of asset store configuration in the main asset store
  // config
  reserved 1;

  oneof backend {
    // Downloads blobs over HTTP and place them into a CAS for retrieval over
    // REv2 ReadBlobs requests.
    HttpFetcherConfiguration http = 2;

    // Returns a given error for all requests, can be wrapped by
    // CachingFetcher for a Push/Fetch service without any server side
    // downloads.
    //
    // Note that in jsonnet configuration, 'error' will need to be in
    // quotes to avoid collision with a protected keyword
    google.rpc.Status error = 3;

    // Downloads blobs or directories using actions run on remote
    // execution workers.
    // Requires the `resource_type` qualifier to be set, with support
    // for the values `application/octet-stream` and `application/x-git`
    // currently.
    //
    // The worker will require access to `wget` and `git` to fully
    // support this fetcher.
    RemoteExecutionFetcherConfiguration remote_execution = 4;
  }

  // Optional: serve a cached asset that is up to this old even when a
  // FetchBlobRequest's oldest_content_accepted asks for newer content.
  //
  // Bazel sets oldest_content_accepted to one hour in the FUTURE on every
  // download that carries no checksum, under the comment "If no checksum is
  // provided, never accept cached content". No asset a server has already
  // stored can satisfy that, so an unchecksummed download reaches its origin
  // on every cold repository cache and fails outright while that origin is
  // down. Bazel has no flag to turn this off.
  //
  // Setting this trades that guarantee for a bounded staleness window: the
  // freshness check becomes min(oldest_content_accepted, now - this), so an
  // asset stored inside the window is served, an older one is still
  // refetched, and a client asking for something LAXER than the window still
  // gets exactly what it asked for. A URL whose content changes upstream
  // inside the window is served stale. That is the whole of the
  // trade, and is why this is opt-in.
  //
  // Leave unset to honour oldest_content_accepted exactly.
  google.protobuf.Duration maximum_cached_asset_staleness = 5;

  // Optional: RE2 regular expressions, matched against each URI of a
  // FetchBlobRequest or FetchDirectoryRequest. When any URI of a request
  // matches any of them, the request skips the asset cache in both
  // directions: it is never answered from a stored asset, and its result is
  // never stored. It always goes to the backend fetcher.
  //
  // This exists for container registry token endpoints. rules_oci and
  // similar clients download an anonymous bearer token from such an endpoint
  // and then send it on their next request. The token is a download with no
  // checksum that expires within minutes, so a staleness window above would
  // serve it long after it stopped working, and every manifest or blob
  // request that carried it would fail with 401 Unauthorized. A token
  // minted with forwarded credentials is also keyed without them, since the
  // Authorization header is a volatile qualifier, so storing it at all would
  // let one client's token answer another client's request.
  //
  // Leave empty to use the built-in list, which covers the token endpoints
  // of quay.io (/v2/auth), Docker Hub (auth.docker.io/token), ghcr.io
  // (/token), Forgejo and Gitea (/v2/token), GitLab (/jwt/auth), nvcr.io
  // (/proxy_auth), docker.elastic.co, and any other registry that serves
  // its token at a path ending in /v2/auth or /token.
  // A non-empty list replaces the built-in one rather than extending it.
  repeated string origin_only_uri_regexes = 6;

  message HttpFetcherConfiguration {
    // Formerly used to specify CAS
    reserved 1;

    // Formerly used to specify a list of instance names permitted to upload to
    // the CAS
    reserved 2;

    // Optional: Options to be used by the HTTP client.
    buildbarn.configuration.http.client.Configuration client = 3;
  }

  message RemoteExecutionFetcherConfiguration {
    buildbarn.configuration.grpc.ClientConfiguration execution_client = 2;
  }
}
